<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Result</title><style>body{font-family:Arial;text-align:center;max-width:650px;margin:60px auto;padding:20px;background:#0b0b0b;color:#fff}a,button{display:inline-block;padding:16px 22px;background:#d4af37;color:#000;text-decoration:none;font-weight:bold;margin-top:20px}</style></head><body><div id="app">Checking payment...</div><script>const p=new URLSearchParams(location.search);const ref=p.get('reference');async function check(){if(p.get('state')==='paid'&&p.get('download'))return show('Payment successful 🎉','Your payment has been verified. Your ebook is ready to download.',p.get('download'));if(!ref)return show('Payment result','No payment reference was found.');try{const r=await fetch('/api/order-status?reference='+encodeURIComponent(ref));const d=await r.json();if(d.status==='paid'&&d.downloadUrl)return show('Payment successful 🎉','Your payment has been verified. Your ebook is ready to download.',d.downloadUrl);show('Payment pending','Your payment has not been confirmed yet. Please wait a moment and refresh this page.')}catch(e){show('Please try again','We could not check the payment status right now.')} }function show(t,m,url){document.getElementById('app').innerHTML='<h1>'+t+'</h1><p>'+m+'</p>'+(url?'<a href="'+url+'">DOWNLOAD YOUR EBOOK</a>':'<button onclick="location.reload()">REFRESH</button>')}check();</script></body></html>
