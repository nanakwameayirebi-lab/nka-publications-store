<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NKA Publications</title>
<style>
body{font-family:Arial;max-width:650px;margin:40px auto;padding:20px;background:#0b0b0b;color:#fff}
input,button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box}
button{cursor:pointer;background:#d4af37;border:0;font-weight:bold}
.book{border:1px solid #333;padding:18px;margin:16px 0}
</style>
</head>
<body>

<h1>NKA PUBLICATIONS</h1>

<p>Buy your ebook. After successful verified payment, you will receive a secure download button.</p>

<input id="email" type="email" placeholder="Your email">

<div class="book">
<h2>CONSCIOUSNESS</h2>
<p>GH¢50</p>
<button onclick="buy('consciousness')">BUY EBOOK</button>
</div>

<div class="book">
<h2>THE DISLOCATION OF BLACK PRIORITY</h2>
<p>GH¢50</p>
<button onclick="buy('black-priority')">BUY EBOOK</button>
</div>

<script>
async function buy(slug){
const email=document.getElementById('email').value.trim();

if(!email)return alert('Enter your email');

const r=await fetch('/api/initialize-payment',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({email,product_slug:slug})
});

const d=await r.json();

if(!r.ok)return alert(d.error||'Could not start payment');

location.href=d.authorization_url;
}
</script>

</body>
</html>
